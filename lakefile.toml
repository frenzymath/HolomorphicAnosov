name = "holomorphic_anosov"
version = "0.1.0"
defaultTargets = ["HolomorphicAnosov", "Comparator"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc1"

[[lean_lib]]
name = "HolomorphicAnosov"
globs = ["HolomorphicAnosov", "HolomorphicAnosov.+"]

[[lean_lib]]
name = "Comparator"
roots = ["Comparator.Challenge", "Comparator.Solution"]
